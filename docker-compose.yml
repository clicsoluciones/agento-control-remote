services:
  agento-control-remote:
    build:
      context: .
      dockerfile: Dockerfile
    image: agento-control-remote:latest
    container_name: agento-control-remote
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-8080}:8080"
      - "${PORT_HTTPS:-8443}:8443"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./ssl:/app/ssl
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - XIAOZHI_UPSTREAM_URL=wss://api.tenclass.net/xiaozhi/v1/
      - DEVICE_ID=7c:0c:5f:54:cc:b8
      - AUTH_TOKEN=test-token
      - CLIENT_ID=ad151bbd-3074-4109-8cd3-94dca0f13426
      - ROBOT_MIC_MUTED=true
